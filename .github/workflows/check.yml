name: Drift Radar check

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send one Discord connectivity/status message"
        required: false
        type: boolean
        default: false
      digest_notification:
        description: "Send one digest of currently read dates"
        required: false
        type: boolean
        default: false
      scan_mode:
        description: "Sources to scan"
        required: false
        type: choice
        options:
          - all
          - youtube
          - calendar
        default: all
  schedule:
    # Live polling: off the top of the hour to reduce GitHub scheduler delays.
    - cron: "2/5 * * * *"
    # Full calendars + OCR scan three times daily.
    - cron: "19 6,14,20 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: write

concurrency:
  group: drift-radar-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Select scan mode
        id: mode
        shell: bash
        run: |
          mode="${{ github.event.inputs.scan_mode }}"
          if [[ "${{ github.event.schedule }}" == "2/5 * * * *" ]]; then
            mode="youtube"
          elif [[ -z "$mode" ]]; then
            mode="all"
          fi
          echo "scan_mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install OCR engine
        if: steps.mode.outputs.scan_mode != 'youtube'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-pol tesseract-ocr-fra
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install quality tools
        if: steps.mode.outputs.scan_mode != 'youtube'
        run: python -m pip install -r requirements-dev.txt
      - name: Verify code and notification contracts
        run: |
          python -m compileall -q main.py discord_notify.py parsers tests
          python -m unittest discover -s tests -p "test_*.py"
      - name: Lint
        if: steps.mode.outputs.scan_mode != 'youtube'
        run: python -m ruff check . --exclude gitmeta
      - name: Run monitor
        shell: bash
        run: |
          args=""
          if [[ "${{ github.event.inputs.test_notification }}" == "true" ]]; then
            args="--test-notification"
          fi
          if [[ "${{ github.event.inputs.digest_notification }}" == "true" ]]; then
            args="$args --digest-notification"
          fi
          python main.py $args --source-type "${{ steps.mode.outputs.scan_mode }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit updated state
        run: |
          git config user.name "drift-radar[bot]"
          git config user.email "drift-radar[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update drift radar state"
          git pull --rebase origin main
          git push origin HEAD:main
